server:
  port: 8084

spring:
  application:
    name: attendance-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ATTENDANCE_DB_NAME:attendance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ums}

springdoc:
  paths-to-exclude: /internal/**

ums:
  audit:
    outbox:
      enabled: ${AUDIT_OUTBOX_ENABLED:true}
  security:
    audience: ums-api
    internal:
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ums/protocol/openid-connect/token}
      client-id: ums-internal
      client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:local-internal-secret-change-me}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3

ums.audit.outbox.enabled: true

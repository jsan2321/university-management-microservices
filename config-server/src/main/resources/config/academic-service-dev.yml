server:
  port: 8082

spring:
  application:
    name: academic-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ACADEMIC_DB_NAME:academic_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ums}

springdoc:
  paths-to-exclude: /internal/**

ums:
  security:
    audience: ums-api
    internal:
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ums/protocol/openid-connect/token}
      client-id: ums-internal
      client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:local-internal-secret-change-me}

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

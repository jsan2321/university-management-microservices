server:
  port: 8081

spring:
  application:
    name: student-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${STUDENT_DB_NAME:student_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ums:
  security:
    audience: ums-api
    internal:
      token-uri: ${KEYCLOAK_TOKEN_URI}
      client-id: ums-internal
      client-secret: ${KEYCLOAK_INTERNAL_CLIENT_SECRET}

eureka:
  instance:
    hostname: student-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling: { probability: ${TRACING_SAMPLING_PROBABILITY:0.1} }
  otlp:
    tracing: { endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces} }

logging:
  level:
    root: WARN
    com.panadi.ums: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

ums.audit.outbox.enabled: true

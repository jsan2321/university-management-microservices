name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

# ─────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════
  #  Backend: Build & Test (Maven)
  # ═══════════════════════════════════════════════════════
  build-and-test:
    name: "Build & Test (Maven)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & run unit tests
        run: ./mvnw verify -B -q

  # ═══════════════════════════════════════════════════════
  #  Frontend: Lint & Test
  # ═══════════════════════════════════════════════════════
  frontend-lint-test:
    name: "Frontend Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ═══════════════════════════════════════════════════════
  #  Build & Push Docker Images
  # ═══════════════════════════════════════════════════════
  build-images:
    name: "Build & Push Images"
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          # Infrastructure services
          - service: config-server
            context: .
            dockerfile: config-server/Dockerfile
          - service: discovery-server
            context: .
            dockerfile: discovery-server/Dockerfile
          # Application services
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: student-service
            context: .
            dockerfile: student-service/Dockerfile
          - service: academic-service
            context: .
            dockerfile: academic-service/Dockerfile
          - service: enrollment-service
            context: .
            dockerfile: enrollment-service/Dockerfile
          - service: attendance-service
            context: .
            dockerfile: attendance-service/Dockerfile
          - service: assignment-service
            context: .
            dockerfile: assignment-service/Dockerfile
          - service: identity-service
            context: .
            dockerfile: identity-service/Dockerfile
          - service: audit-service
            context: .
            dockerfile: audit-service/Dockerfile
          # Frontend
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



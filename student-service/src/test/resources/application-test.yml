# ─── Integration Test Profile ─────────────────────────────────────────────────
# Used by @ActiveProfiles("test") in StudentServiceIntegrationTest.
# The PostgreSQL datasource is NOT configured here — it is provided at runtime
# by @ServiceConnection on the Testcontainers PostgreSQLContainer, which
# registers auto-configuration overrides that take precedence over any static
# spring.datasource.* properties.

spring:
  cloud:
    config:
      enabled: false              # Skip Config Server — no timeout during tests
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate just validates
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Placeholder URI — the JwtDecoder bean is replaced with a @MockitoBean,
          # so no network call is ever made to this address.
          issuer-uri: http://localhost:9999/realms/test

eureka:
  client:
    enabled: false                # No Eureka server in tests

ums:
  security:
    audience: ums-api
    # Omitting internal.client-secret intentionally:
    # SecurityAutoConfiguration uses @ConditionalOnProperty(name = "ums.security.internal.client-secret")
    # so neither InternalAccessTokenProvider nor the Feign token interceptor will be created.

logging:
  level:
    com.panadi.ums: DEBUG         # Verbose for test diagnostics
    org.flywaydb: INFO
